name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Qt has no display in CI, and esptool must not emit ANSI into captured
      # output (the same reason the app scrubs $TERM from its child processes).
      QT_QPA_PLATFORM: offscreen
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Check the CLI starts without a device
        run: |
          python esp_flasher.py --version
          python esp_flasher.py --help > /dev/null
          # erase must refuse without --yes (exit 2)
          python esp_flasher.py erase -p /dev/null && exit 1 || test $? -eq 2

      - name: Validate the desktop entry
        run: |
          bash -n packaging/build-deb.sh
          printf '#!/bin/sh\ntrue\n' > /tmp/fakebin && chmod +x /tmp/fakebin
          ./packaging/build-deb.sh /tmp/fakebin amd64 0.0.0 /tmp/debout
          dpkg-deb -x /tmp/debout/esp-flasher_0.0.0_amd64.deb /tmp/debstage
          desktop-file-validate /tmp/debstage/usr/share/applications/esp-flasher.desktop

  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build the standalone binary
        run: python build.py --name esp_flasher-linux-amd64

      - name: Smoke-test the bundle
        run: |
          ./dist/esp_flasher-linux-amd64 --version
          # the frozen binary must be able to re-invoke itself as esptool
          ./dist/esp_flasher-linux-amd64 --esptool-worker version

      - uses: actions/upload-artifact@v4
        with:
          name: esp_flasher-linux-amd64
          path: dist/esp_flasher-linux-amd64
